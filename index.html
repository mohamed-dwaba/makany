<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="فهرس تفاعلي منظّم لفيديوهات قناة مكاني — فقه النفس | د. عبدالرحمن ذاكر الهاشمي">
<meta name="theme-color" content="#0d7a5f">
<title>فهرس مكاني — فقه النفس | عبدالرحمن ذاكر الهاشمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>if(typeof firebase==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"><\/script>');document.write('<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"><\/script>');document.write('<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore-compat.js"><\/script>');}</script>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#fbfcfd; --ink:#182230; --muted:#65758a;
  --line:#e3e8ee; --accent:#0d7a5f; --accent2:#0a9d7a; --accent-soft:#e4f3ee;
  --accent-ink:#ffffff; --mark:#ffe58a; --shadow:0 10px 30px rgba(15,35,60,.08);
  --radius:16px; --chip:#eef2f6; --yt:#e0021b;
}
[data-theme="dark"]{
  --bg:#0e141b; --panel:#151d27; --panel2:#182130; --ink:#e9eef5; --muted:#93a3b8;
  --line:#243040; --accent:#2cc29a; --accent2:#24a384; --accent-soft:rgba(44,194,154,.13);
  --accent-ink:#06251d; --mark:#8a6d1f; --shadow:0 12px 32px rgba(0,0,0,.35);
  --chip:#1d2836;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{font-family:inherit; cursor:pointer}
a{color:inherit; text-decoration:none}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:14px;
  padding:10px 20px; background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand .logo{
  width:42px; height:42px; border-radius:13px; flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid; place-items:center; font-size:21px; box-shadow:var(--shadow);
}
.brand h1{font-size:17px; font-weight:800; margin:0; line-height:1.2}
.brand p{margin:0; font-size:11.5px; color:var(--muted); font-weight:500}
.searchbox{
  flex:1; display:flex; align-items:center; gap:8px; max-width:560px; margin-inline:auto;
  background:var(--bg); border:1.5px solid var(--line); border-radius:999px; padding:8px 16px;
  transition:border-color .2s, box-shadow .2s;
}
.searchbox:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
.searchbox .icon{opacity:.55; font-size:15px}
.searchbox input{
  flex:1; border:0; outline:0; background:transparent; color:var(--ink);
  font-family:inherit; font-size:14.5px; font-weight:500;
}
.searchbox input::placeholder{color:var(--muted)}
#clearq{
  border:0; background:var(--chip); color:var(--muted); width:22px; height:22px;
  border-radius:50%; font-size:11px; line-height:1; display:grid; place-items:center;
}
#theme{
  border:1.5px solid var(--line); background:var(--panel); color:var(--ink);
  width:40px; height:40px; border-radius:12px; font-size:17px; flex:0 0 auto;
  transition:transform .2s;
}
#theme:hover{transform:scale(1.06)}
#menuBtn{display:none; border:1.5px solid var(--line); background:var(--panel); color:var(--ink);
  width:40px; height:40px; border-radius:12px; font-size:17px}

/* ---------- layout ---------- */
.layout{
  max-width:1440px; margin:0 auto; padding:22px 20px 60px;
  display:grid; grid-template-columns:288px minmax(0,1fr); gap:24px; align-items:start;
}
aside{
  position:sticky; top:78px; max-height:calc(100vh - 96px); overflow-y:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; display:flex; flex-direction:column; gap:4px;
}
aside::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px}
.side-title{font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.4px; margin:10px 6px 6px}
.side-stats{display:flex; gap:8px; margin-bottom:10px}
.stat{
  flex:1; background:var(--accent-soft); border-radius:12px; padding:9px 4px; text-align:center;
}
.stat b{display:block; font-size:15px; color:var(--accent); font-weight:800}
.stat span{font-size:10px; color:var(--muted); font-weight:600}
.side-progress{
  background:var(--accent-soft); border-radius:12px; padding:11px; margin-bottom:10px;
  display:flex; flex-direction:column; gap:8px;
}
.side-progress .row1{display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:800}
.side-progress .row1 b{color:var(--accent)}
.side-progress .row1 span{color:var(--muted); font-size:11.5px}
.side-progress .bar{height:8px; background:var(--panel); border-radius:99px; overflow:hidden}
.side-progress .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:99px; transition:width .3s}
.side-progress .row2{display:flex; gap:6px}
.side-progress .row2 button{
  flex:1; border:1.5px solid var(--line); background:var(--panel); border-radius:8px;
  font-size:10.5px; padding:4px 2px; font-weight:700; color:var(--muted); transition:all .15s;
}
.side-progress .row2 button:hover{color:var(--accent); border-color:var(--accent)}

/* ---------- cloud sync ---------- */
.cloud-card{
  background:linear-gradient(135deg, var(--accent-soft), transparent 85%);
  border:1.5px solid var(--line); border-radius:12px; padding:11px; margin-bottom:10px;
  display:flex; flex-direction:column; gap:8px;
}
.cloud-card .ttl{font-size:12px; font-weight:800; display:flex; align-items:center; gap:6px}
.cloud-card .sub{font-size:10.5px; color:var(--muted); font-weight:600; line-height:1.7}
.cloud-btn{
  border:1.5px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  border-radius:9px; padding:6px; font-weight:800; font-size:11.5px; font-family:inherit; cursor:pointer;
  transition:filter .15s;
}
.cloud-btn:hover{filter:brightness(1.1)}
.cloud-btn.ghost{background:transparent; color:var(--accent)}
.cloud-user{display:flex; align-items:center; gap:8px}
.cloud-user .av{
  width:26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; font-weight:800; font-size:12px; flex:0 0 auto;
}
.cloud-user .nm{flex:1; min-width:0; font-size:11.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cloud-user .out{border:0; background:transparent; color:var(--muted); font-size:15px; cursor:pointer}
.cloud-user .out:hover{color:var(--yt)}
.sync-dot{width:8px; height:8px; border-radius:50%; background:var(--accent); display:inline-block; animation:pulse 2.2s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---------- auth modal ---------- */
.modal{
  position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center;
  background:rgba(8,16,24,.55); backdrop-filter:blur(4px); padding:16px;
}
.modal.show{display:flex}
.auth-panel{
  background:var(--panel); border-radius:18px; padding:22px; width:min(360px,94vw);
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:11px;
}
.auth-panel h3{margin:0; font-size:16px; font-weight:800}
.auth-panel .desc{font-size:12px; color:var(--muted); font-weight:600; line-height:1.8; margin:0}
.auth-panel input{
  border:1.5px solid var(--line); background:var(--bg); border-radius:10px; padding:9px 12px;
  font-family:inherit; font-size:13px; color:var(--ink); outline:none; width:100%;
}
.auth-panel input:focus{border-color:var(--accent)}
.auth-err{font-size:11.5px; color:#d63b3b; font-weight:700; min-height:0; line-height:1.6}
.auth-sep{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; font-weight:700}
.auth-sep::before,.auth-sep::after{content:''; flex:1; height:1px; background:var(--line)}
.auth-cancel{border:0; background:transparent; color:var(--muted); font-weight:700; cursor:pointer; font-family:inherit; font-size:12.5px; padding:2px}

/* ---------- شريط الإعلان ---------- */
#topbanner{
  display:none; align-items:center; gap:10px; padding:8px 16px;
  background:linear-gradient(135deg,#e8b95a,#dd9c33); color:#241500;
  font-size:12.5px; font-weight:700; position:sticky; top:0; z-index:60;
}
#topbanner.show{display:flex}
#topbanner a{font-weight:800; text-decoration:underline}
#topbanner button{border:0; background:transparent; color:#241500; font-size:14px; cursor:pointer; margin-inline-start:auto}

/* ---------- لوحة الأدمن ---------- */
.adm-btn{
  border:1.5px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  border-radius:9px; padding:6px; font-weight:800; font-size:11px; font-family:inherit; cursor:pointer;
}
.adm-sec{border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:7px; text-align:right}
.adm-sec h4{margin:0; font-size:12.5px; font-weight:800}
.adm-sec label{font-size:10px; color:var(--muted); font-weight:800; display:block; margin-bottom:3px}
.adm-sec input, .adm-sec select{width:100%; background:var(--bg); border:1.5px solid var(--line); border-radius:9px; padding:7px 10px; color:var(--ink); font-size:12px; outline:none; font-family:inherit}
.adm-sec input:focus, .adm-sec select:focus{border-color:var(--accent)}
.adm-sec .hint{font-size:10.5px; color:var(--muted); font-weight:600; line-height:1.7; margin:0}
.adm-list{max-height:130px; overflow-y:auto; display:flex; flex-direction:column; gap:5px; font-size:11.5px}
.adm-list::-webkit-scrollbar{width:6px}
.adm-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px}
.adm-rowb{display:flex; align-items:center; gap:6px}
.adm-rowb .t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.adm-rowb .rbtn{border:1.5px solid var(--line); background:transparent; color:var(--muted); border-radius:7px; padding:2px 8px; font-size:10.5px; font-weight:700; font-family:inherit; cursor:pointer}
.adm-rowb .rbtn:hover{color:var(--danger); border-color:var(--danger)}
.adm-toggle{display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; cursor:pointer}
.adm-toggle input{width:auto; accent-color:var(--accent)}
.adm-btns{display:flex; gap:7px}
.adm-btns .adm-btn{flex:1}
.adm-badge{background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:1px 7px; font-size:10px; font-weight:800}
/* أزرار أدمن في صف الفيديو */
.adm-act{border:1.5px solid var(--line); border-radius:8px; padding:2px 8px; font-size:10.5px; font-weight:700; color:var(--muted); background:transparent; font-family:inherit; cursor:pointer}
.adm-act:hover{border-color:var(--accent); color:var(--accent)}
/* تبويبات اللوحة */
.adm-tabs{display:flex; gap:5px; flex-wrap:wrap; border-bottom:1.5px solid var(--line); padding-bottom:8px}
.adm-tab{border:1.5px solid var(--line); background:transparent; color:var(--muted); border-radius:9px; padding:4px 10px; font-size:11px; font-weight:800; font-family:inherit; cursor:pointer}
.adm-tab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.adm-pane{display:none; flex-direction:column; gap:10px}
.adm-pane.show{display:flex}
.adm-grid{display:grid; grid-template-columns:1fr 1fr; gap:7px}
.adm-cell{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:11px; font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:6px}
.adm-cell b{color:var(--accent); font-size:13px}
/* صفوف الصندوق */
.inb{display:flex; gap:8px; align-items:flex-start; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:7px}
.inb img{width:72px; height:41px; border-radius:6px; flex:0 0 auto; background:var(--chip)}
.inb .wi{flex:1; min-width:0}
.inb .wi .t{font-size:11.5px; font-weight:700; line-height:1.5; max-height:2.9em; overflow:hidden}
.inb .wi .m{font-size:9.5px; color:var(--muted); font-weight:600; margin-top:2px; display:flex; gap:7px; flex-wrap:wrap}
.inb .st{border-radius:6px; padding:1px 7px; font-size:9px; font-weight:800; background:var(--chip); color:var(--muted)}
.inb .st.pending{background:rgba(224,169,82,.2); color:#b97317}
.inb .st.deferred{background:rgba(109,124,168,.2); color:#5a6a9d}
.inb .st.approved{background:var(--accent-soft); color:var(--accent)}
.inb .st.excluded{background:rgba(214,59,59,.15); color:var(--danger)}
.inb .abtns{display:flex; gap:4px; margin-top:5px; flex-wrap:wrap}
.inb .abtn{border:1.5px solid var(--line); background:transparent; color:var(--muted); border-radius:7px; padding:2px 8px; font-size:10px; font-weight:800; font-family:inherit; cursor:pointer}
.inb .abtn.go{border-color:var(--accent); color:var(--accent)}
.inb .abtn:hover{filter:brightness(.94)}
.inb.sel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
/* صفوف السلاسل */
.smrow{display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:5px 8px; font-size:11px; font-weight:700}
.smrow .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.smrow .c{color:var(--muted); font-weight:600; font-size:10px}
.smrow.hid{opacity:.55}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%;
  padding:8px 10px; border-radius:11px; border:0; background:transparent;
  color:var(--ink); font-size:13.3px; font-weight:600; text-align:right;
  transition:background .15s;
}
.nav-item:hover{background:var(--chip)}
.nav-item.active{background:var(--accent-soft); color:var(--accent)}
.nav-item .ico{font-size:15px; width:22px; text-align:center; flex:0 0 auto}
.nav-item .lbl{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nav-item .cnt{
  background:var(--chip); color:var(--muted); border-radius:999px; padding:2px 8px;
  font-size:10.5px; font-weight:700; flex:0 0 auto;
}
.nav-item.active .cnt{background:var(--accent); color:var(--accent-ink)}

main{min-width:0}

/* ---------- home ---------- */
.hero{
  background:linear-gradient(135deg,var(--accent) 0%, var(--accent2) 100%);
  color:var(--accent-ink); border-radius:22px; padding:30px 28px; margin-bottom:22px;
  position:relative; overflow:hidden;
}
.hero::after{
  content:''; position:absolute; inset:0; opacity:.14; pointer-events:none;
  background:radial-gradient(circle at 85% 15%, #fff 0 12%, transparent 13%),
             radial-gradient(circle at 75% 90%, #fff 0 8%, transparent 9%),
             radial-gradient(circle at 95% 60%, #fff 0 6%, transparent 7%);
}
.hero h2{margin:0 0 6px; font-size:24px; font-weight:800}
.hero p{margin:0; font-size:14px; opacity:.9; font-weight:500}
.hero .hint{margin-top:14px; font-size:12.5px; opacity:.85}
.hero .hbar{margin-top:16px; height:10px; background:rgba(0,0,0,.18); border-radius:99px; overflow:hidden}
.hero .hbar i{display:block; height:100%; width:0; background:rgba(255,255,255,.85); border-radius:99px; transition:width .4s}
.hero .hmeta{display:flex; justify-content:space-between; margin-top:5px; font-size:11.5px; opacity:.9; font-weight:700}
.continue-btn{
  margin-top:14px; background:rgba(255,255,255,.18); border:1.5px solid rgba(255,255,255,.5);
  color:#fff; border-radius:12px; padding:8px 18px; font-weight:800; font-size:13px;
  transition:background .2s; position:relative; z-index:1;
}
.continue-btn:hover{background:rgba(255,255,255,.3)}
.cat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:14px}
.cat-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:transform .18s, box-shadow .18s, border-color .18s;
  display:flex; flex-direction:column; gap:10px; text-align:right;
}
.cat-card:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--accent)}
.cat-card .top{display:flex; align-items:center; gap:10px}
.cat-card .ico{
  width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:20px; flex:0 0 auto;
}
.cat-card h3{margin:0; font-size:14.5px; font-weight:800; line-height:1.35}
.cat-card .cnt{margin-inline-start:auto; font-size:11.5px; font-weight:800; color:var(--muted);
  background:var(--chip); border-radius:999px; padding:3px 10px; flex:0 0 auto}
.cat-card .desc{font-size:11.8px; color:var(--muted); line-height:1.6; min-height:34px}
.cat-card .series-tags{display:flex; flex-wrap:wrap; gap:5px}
.cat-card .tag{
  font-size:10.5px; font-weight:600; color:var(--muted); background:var(--chip);
  border-radius:999px; padding:2.5px 9px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.sec-title{display:flex; align-items:center; gap:10px; margin:26px 2px 12px; font-size:16.5px; font-weight:800}
.sec-title .cnt{font-size:12px; color:var(--muted); font-weight:700; background:var(--chip); border-radius:999px; padding:3px 11px}

/* ---------- toolbar ---------- */
.toolbar{
  display:flex; align-items:center; flex-wrap:wrap; gap:10px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; margin-bottom:18px;
}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  border:1.5px solid var(--line); background:transparent; color:var(--muted);
  border-radius:999px; padding:5px 13px; font-size:12px; font-weight:700;
  transition:all .15s;
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.toolbar select{
  border:1.5px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:10px; padding:6px 10px; font-family:inherit; font-size:12.5px; font-weight:600; outline:none;
}
.toolbar .spacer{flex:1}
.toolbar .res{font-size:12.5px; color:var(--muted); font-weight:600}

/* ---------- series accordion ---------- */
.series{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; scroll-margin-top:84px}
.series-h{
  width:100%; display:flex; align-items:center; gap:10px; padding:13px 16px;
  background:transparent; border:0; color:var(--ink); text-align:right;
}
.series-h:hover{background:var(--panel2)}
.series-h .ep-ico{
  width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
  font-size:15px; background:var(--accent-soft); flex:0 0 auto;
}
.series-h h3{margin:0; font-size:14.5px; font-weight:800; flex:1; min-width:0; line-height:1.4}
.series-h .cnt{
  font-size:11px; font-weight:800; color:var(--accent); background:var(--accent-soft);
  border-radius:999px; padding:3px 10px; flex:0 0 auto;
}
.series-h .prog{
  font-size:11px; font-weight:800; color:var(--accent-ink); background:var(--accent);
  border-radius:999px; padding:3px 10px; flex:0 0 auto;
}
.series-h .chev{transition:transform .25s; color:var(--muted); font-size:13px; flex:0 0 auto}
.series.open .series-h .chev{transform:rotate(90deg)}
.series-b{display:none; border-top:1px solid var(--line); padding:6px}
.series.open .series-b{display:block}

/* ---------- video row ---------- */
.vrow{
  display:grid; grid-template-columns:26px 44px minmax(0,1fr) auto; align-items:center; gap:10px;
  padding:9px 12px; border-radius:11px; transition:background .14s; cursor:pointer;
}
.vrow:hover{background:var(--panel2)}
.vrow + .vrow{margin-top:2px}
.watch-cb{
  width:24px; height:24px; border-radius:8px; border:2px solid var(--line);
  background:transparent; color:var(--accent-ink); font-size:13px; font-weight:800;
  display:grid; place-items:center; padding:0; line-height:1; flex:0 0 auto;
  transition:all .15s;
}
.watch-cb:hover{border-color:var(--accent); transform:scale(1.1)}
.watch-cb.on{background:var(--accent); border-color:var(--accent)}
.epb{
  min-width:34px; height:28px; padding:0 7px; border-radius:9px; display:grid; place-items:center;
  background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:12px;
}
.vrow .t{min-width:0}
.vrow .title{font-size:13.6px; font-weight:600; line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.vrow:hover .title{color:var(--accent)}
.vrow.watched .title{opacity:.5}
.vrow.watched .epb{background:var(--accent); color:var(--accent-ink)}
.nn{background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:2px 7px; font-weight:800; font-size:10.5px; flex:0 0 auto; white-space:nowrap}
.vrow .sub{font-size:11px; color:var(--muted); margin-top:2px; font-weight:600;
  display:flex; gap:9px; flex-wrap:wrap; align-items:center}
.vrow .sub .kk{background:var(--chip); border-radius:6px; padding:1px 7px}
mark{background:var(--mark); color:var(--ink); border-radius:4px; padding:0 3px}
.vrow .meta{display:flex; align-items:center; gap:8px; font-size:11.3px; color:var(--muted); font-weight:600; white-space:nowrap}
.vrow .meta .d{background:var(--chip); border-radius:8px; padding:3px 8px; font-weight:700}
.yt-link{
  border:1.5px solid var(--line); border-radius:8px; padding:2px 8px; font-size:11px;
  color:var(--muted); transition:all .15s;
}
.yt-link:hover{color:#fff; background:var(--yt); border-color:var(--yt)}
.player{grid-column:1/-1; padding:6px 4px 12px}
.player .frame{position:relative; padding-bottom:56.25%; height:0; border-radius:12px; overflow:hidden; background:#000; max-width:860px; margin:0 auto}
.player iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.pbar{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; max-width:860px; margin:6px auto 0; font-size:11px; color:var(--muted); font-weight:700}
.pbar a{color:var(--accent); font-weight:800}
.pbar a:hover{text-decoration:underline}
.pbar .pnote{color:#c07a1e; background:rgba(224,169,82,.15); border:1px dashed rgba(224,169,82,.45); border-radius:9px; padding:3px 10px; font-size:10.5px; line-height:1.7}

.note{
  background:var(--accent-soft); border:1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
  color:var(--ink); border-radius:var(--radius); padding:13px 16px; font-size:12.8px;
  line-height:1.8; margin-bottom:16px; font-weight:500;
}
.note b{color:var(--accent)}

.crumb{display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:12.5px; color:var(--muted); font-weight:600; flex-wrap:wrap}
.crumb button{border:0; background:transparent; color:var(--accent); font-weight:700; font-size:12.5px; padding:0}
.crumb button:hover{text-decoration:underline}

.empty{padding:60px 20px; text-align:center; color:var(--muted); font-weight:600}
.empty .big{font-size:44px; margin-bottom:12px}

footer{text-align:center; color:var(--muted); font-size:11.5px; margin-top:40px; font-weight:600; line-height:2}

#totop{
  position:fixed; bottom:22px; inset-inline-start:22px; z-index:60;
  width:44px; height:44px; border-radius:14px; border:0; font-size:18px;
  background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
}
#totop.show{opacity:1; pointer-events:auto}
#totop:hover{transform:translateY(-3px)}

.overlay{position:fixed; inset:0; background:rgba(10,20,30,.45); z-index:70; opacity:0; pointer-events:none; transition:opacity .25s}
.overlay.show{opacity:1; pointer-events:auto}

@media (max-width:1020px){
  .layout{grid-template-columns:1fr}
  aside{
    position:fixed; inset-block:0; inset-inline-start:0; z-index:80; width:300px; max-height:none;
    border-radius:0; border-inline-end:1px solid var(--line);
    transform:translateX(105%); transition:transform .28s ease;
  }
  aside.open{transform:translateX(0) !important}
  #menuBtn{display:grid; place-items:center}
  .searchbox{max-width:none}
  .brand p{display:none}
  .hero{padding:22px 18px}
  .hero h2{font-size:19px}
  .vrow{grid-template-columns:26px 38px minmax(0,1fr); }
  .vrow .meta{grid-column:3; justify-content:flex-start}
}

<script>(function(){
"use strict";

var $ = function(s){ return document.querySelector(s); };
var main = $('#main'), sidebar = $('#sidebar');

/* ============================================================
   Public data
   ------------------------------------------------------------
   Only published documents are requested. Firestore rules enforce the same

   ============================================================ */
var FIREBASE_CONFIG = {"apiKey":"AIzaSyCVEw96pJ-nueLANu5IHG-5x9PMFE_bFVk","authDomain":"makany-cfcac.firebaseapp.com","projectId":"makany-cfcac","storageBucket":"makany-cfcac.firebasestorage.app","messagingSenderId":"1059343717954","appId":"1:1059343717954:web:f743a509870e15cde37fdb"};
var CACHE_KEY = 'makany-public-v2';
var CACHE_MAX_AGE = 24 * 60 * 60 * 1000;
var DEFAULT_SETTINGS = {
  siteTitle: 'فهرس مكاني',
  siteSubtitle: 'فقه النفس · د. عبدالرحمن ذاكر الهاشمي',
  siteDescription: 'فهرس تفاعلي منظّم لفيديوهات قناة مكاني — فقه النفس | د. عبدالرحمن ذاكر الهاشمي',
  banner: { enabled:false, text:'', link:'' },
  sections: {
    showNewVideos: true,
    showUnclassified: true,
    newVideosTitle: 'فيديوهات جديدة',
    unclassifiedTitle: 'فيديوهات غير مصنفة'
  }
};

var DATA = {
  categories: [], series: [], nestedSeries: [], videos: [],
  settings: DEFAULT_SETTINGS, generated: null, version: 0
};
var CATS = [], NESTED = [], NEWCAT = null, UNCL = null;
var REAL_CATS = [];
var TOTAL = 0, VISIBLE_BY_ID = new Map(), CONTEXT_BY_ID = new Map();
var dataReady = false;
var lastVersion = 0;
var versionUnsub = null;
var refreshInFlight = false;

var state = { view:'home', cat:null, series:null, nested:null, q:'', kind:'all', sort:'default', focusSeries:null, hideWatched:false, pendingOpen:null };

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function hl(text, q){
  var t = esc(text);
  if(!q) return t;
  try{
    var rx = new RegExp('('+escRe(esc(q))+')','gi');
    return t.replace(rx,'<mark>$1</mark>');
  }catch(e){ return t; }
}
function numberOr(value, fallback){
  var n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}
function orderOf(v){ return numberOr(v && v.order, Number.MAX_SAFE_INTEGER); }
function titleCompare(a, b){ return String(a||'').localeCompare(String(b||''), 'ar'); }
function parseViews(v){
  if(!v) return -1;
  var m = String(v).match(/^([\d.]+)\s*([KM])?$/i);
  if(!m) return -1;
  var n = parseFloat(m[1]);
  if(m[2]) n *= (m[2].toUpperCase()==='K') ? 1e3 : 1e6;
  return n;
}
function parseAge(a){
  if(!a) return 99999;
  var m = String(a).match(/(\d+)\s*(y|mo|w|d|hr)/i);
  if(!m) return 99999;
  var n = +m[1], u = m[2].toLowerCase();
  return n * (u==='y'?365 : u==='mo'?30 : u==='w'?7 : u==='d'?1 : 1/24);
}
function kindOf(item){ return item.kind || 'فيديو'; }
function ageFrom(pub){
  var d = (Date.now() - new Date(pub).getTime()) / 864e5;
  if(!isFinite(d) || d < 0) return '';
  if(d < 1) return 'اليوم';
  if(d < 7) return Math.max(1,Math.round(d))+' d ago';
  if(d < 30) return Math.max(1,Math.round(d/7))+' w ago';
  if(d < 365) return Math.max(1,Math.round(d/30))+' mo ago';
  return Math.max(1,Math.round(d/365))+' y ago';
}
function isoDay(value){
  if(!value) return '';
  var d = new Date(value);
  if(!isFinite(d.getTime())) return '';
  try{ return d.toLocaleDateString('ar-EG', { year:'numeric', month:'long', day:'numeric' }); }
  catch(e){ return d.toISOString().slice(0,10); }
}
function normalizeSettings(raw){
  var s = raw && typeof raw === 'object' ? raw : {};
  var b = s.banner && typeof s.banner === 'object' ? s.banner : {};
  var sec = s.sections && typeof s.sections === 'object' ? s.sections : {};
  return {
    siteTitle: String(s.siteTitle || DEFAULT_SETTINGS.siteTitle),
    siteSubtitle: String(s.siteSubtitle || DEFAULT_SETTINGS.siteSubtitle),
    siteDescription: String(s.siteDescription || DEFAULT_SETTINGS.siteDescription),
    banner: {
      enabled: b.enabled === true,
      text: String(b.text || ''),
      link: /^https?:\/\//i.test(String(b.link || '')) ? String(b.link) : ''
    },
    sections: {
      showNewVideos: sec.showNewVideos !== false,
      showUnclassified: sec.showUnclassified !== false,
      newVideosTitle: String(sec.newVideosTitle || DEFAULT_SETTINGS.sections.newVideosTitle),
      unclassifiedTitle: String(sec.unclassifiedTitle || DEFAULT_SETTINGS.sections.unclassifiedTitle)
    }
  };
}

/* ---------- build the display model from published Firestore docs ---------- */
function mapVideo(v){
  var id = v.youtubeId || v.id;
  if(!id) return null;
  var episode = v.episode === null || v.episode === undefined || v.episode === '' ? null : numberOr(v.episode, null);
  return {
    id: id,
    title: String(v.title || v.t || ''),
    ep: episode,
    duration: String(v.duration || v.dur || ''),
    views: String(v.views || ''),
    age: String(v.age || (v.youtubePublishedAt ? ageFrom(v.youtubePublishedAt) : '')),
    kind: v.kind === 'بثّ' || v.kind === 'بث' ? 'بثّ' : 'فيديو',
    seriesId: v.seriesId || null,
    order: numberOr(v.order, 0),
    showInNew: v.showInNew === true,
    publishedAt: v.youtubePublishedAt || null,
    _new: v.showInNew === true
  };
}
function sortVideoItems(items){
  return items.slice().sort(function(a,b){
    var ao = orderOf(a), bo = orderOf(b);
    if(ao !== bo) return ao - bo;
    if(a.ep != null && b.ep != null && a.ep !== b.ep) return a.ep - b.ep;
    if(a.ep == null && b.ep != null) return 1;
    if(a.ep != null && b.ep == null) return -1;
    return titleCompare(a.title, b.title);
  });
}

function buildModel(){
  var settings = normalizeSettings(DATA.settings);
  var categories = (Array.isArray(DATA.categories) ? DATA.categories : []).filter(function(c){ return c && c.published !== false; });
  var seriesDocs = (Array.isArray(DATA.series) ? DATA.series : []).filter(function(s){ return s && s.published !== false; });
  var videoDocs = (Array.isArray(DATA.videos) ? DATA.videos : []).filter(function(v){ return v && v.published !== false; });
  var nestedDocs = (Array.isArray(DATA.nestedSeries) ? DATA.nestedSeries : []).filter(function(n){ return n && n.published !== false; });
  CATS = [];
  NESTED = [];
  NEWCAT = null;
  UNCL = null;
  CONTEXT_BY_ID = new Map();

  categories.sort(function(a,b){ return orderOf(a) - orderOf(b) || titleCompare(a.title, b.title); });
  var catById = new Map();
  categories.forEach(function(c){ catById.set(c.id, c); });

  seriesDocs.sort(function(a,b){ return orderOf(a) - orderOf(b) || titleCompare(a.title, b.title); });
  var seriesById = new Map();
  seriesDocs.forEach(function(s){
    if(!catById.has(s.categoryId)) return; /* hidden parent category */
    seriesById.set(s.id, s);
  });

  var bySeries = new Map();
  var unclassified = [];
  var visible = [];
  videoDocs.forEach(function(v){
    if(v.published === false) return;
    if(v.seriesId){
      var s = seriesById.get(v.seriesId);
      if(!s) return; /* series hidden/missing: hide its videos, never delete them */
      var c = catById.get(s.categoryId);
      if(!c) return;
    }
    var mapped = mapVideo(v);
    if(!mapped) return;
    visible.push(mapped);
    if(!mapped.seriesId){
      unclassified.push(mapped);
      CONTEXT_BY_ID.set(mapped.id, { catShort: settings.sections.unclassifiedTitle, series: 'فيديوهات' });
    } else {
      if(!bySeries.has(mapped.seriesId)) bySeries.set(mapped.seriesId, []);
      bySeries.get(mapped.seriesId).push(mapped);
      var seriesDoc = seriesById.get(mapped.seriesId);
      var catDoc = seriesDoc ? catById.get(seriesDoc.categoryId) : null;
      CONTEXT_BY_ID.set(mapped.id, {
        catShort: catDoc ? catDoc.title : '',
        series: seriesDoc ? seriesDoc.title : ''
      });
    }
  });
  unclassified.sort(function(a,b){ return orderOf(a) - orderOf(b) || titleCompare(a.title, b.title); });

  var visibleMap = new Map();
  visible.forEach(function(v){ visibleMap.set(v.id, v); });

  var realCats = categories.map(function(c){
    var items = [];
    var series = seriesDocs.filter(function(s){ return s.categoryId === c.id; }).map(function(s){
      var arr = sortVideoItems(bySeries.get(s.id) || []);
      items = items.concat(arr);
      return { name: s.title, items: arr, seriesId: s.id };
    });
    return {
      name: c.title,
      icon: c.icon || '📁',
      desc: c.description || '',
      series: series,
      total: items.length,
      virtual: false,
      categoryId: c.id
    };
  });

  NESTED = nestedDocs.sort(function(a,b){ return orderOf(a) - orderOf(b) || titleCompare(a.title, b.title); }).map(function(n){
    var items = (Array.isArray(n.items) ? n.items : []).map(function(entry){
      var video = visibleMap.get(entry.videoId);
      if(!video) return null;
      var copy = Object.assign({}, video);
      if(entry.episode !== null && entry.episode !== undefined) copy.ep = numberOr(entry.episode, copy.ep);
      copy._ctx = { catShort: 'مادة متداخلة', series: n.title };
      return copy;
    }).filter(Boolean);
    return { name: n.title, items: items, desc: n.description || '' };
  }).filter(function(n){ return n.items.length > 0; });

  REAL_CATS = realCats;
  CATS = [];

  if(settings.sections.showNewVideos){
    var newItems = visible.filter(function(v){ return v.showInNew; }).sort(function(a,b){ return orderOf(a) - orderOf(b) || titleCompare(a.title, b.title); });
    if(newItems.length){
      NEWCAT = {
        name: settings.sections.newVideosTitle,
        icon: '🆕',
        desc: 'فيديوهات اعتمدها فريق التحرير للظهور في هذا القسم — العضوية مستقلة عن السلسلة',
        series: [{ name: 'فيديوهات', items: newItems }],
        total: newItems.length,
        virtual: true,
        virtualKind: 'new'
      };
      CATS.push(NEWCAT);
    } else NEWCAT = null;
  } else NEWCAT = null;

  if(settings.sections.showUnclassified && unclassified.length){
    UNCL = {
      name: settings.sections.unclassifiedTitle,
      icon: '📥',
      desc: 'فيديوهات منشورة لم تُعيَّن لسلسلة بعد — تُصنَّف من لوحة التحكم',
      series: [{ name: 'فيديوهات', items: unclassified }],
      total: unclassified.length,
      virtual: true,
      virtualKind: 'unclassified'
    };
    CATS.push(UNCL);
  } else UNCL = null;

  CATS = CATS.concat(realCats);
  TOTAL = visible.length;
  VISIBLE_BY_ID = visibleMap;

  DATA.settings = settings;
}

function allItems(){ return Array.from(VISIBLE_BY_ID.values()); }
function findItem(id){ return VISIBLE_BY_ID.get(id) || null; }
function catSeriesCount(){
  var n = 0;
  REAL_CATS.forEach(function(c){ n += c.series.length; });
  return n;
}

/* ---------- cache ---------- */
function cachePayload(){
  var settings = normalizeSettings(DATA.settings);
  return {
    version: lastVersion,
    cachedAt: Date.now(),
    generated: DATA.generated,
    settings: settings,
    categories: (DATA.categories||[]).map(function(c){
      return { id:c.id, title:c.title, description:c.description||'', icon:c.icon||'', order:c.order, published:c.published !== false };
    }),
    series: (DATA.series||[]).map(function(s){
      return { id:s.id, title:s.title, description:s.description||'', thumbnailUrl:s.thumbnailUrl||'', categoryId:s.categoryId, order:s.order, published:s.published !== false };
    }),
    videos: (DATA.videos||[]).map(function(v){
      return {
        id:v.id, youtubeId:v.youtubeId||v.id, title:v.title, seriesId:v.seriesId||null,
        hasSeries:!!v.seriesId, order:v.order, episode:v.episode === undefined ? null : v.episode,
        kind:v.kind||'فيديو', duration:v.duration||'', views:v.views||'', age:v.age||'',
        thumbnailUrl:v.thumbnailUrl||'', youtubePublishedAt:v.youtubePublishedAt||null,
        published:v.published !== false, showInNew:v.showInNew === true
      };
    }),
    nestedSeries: (DATA.nestedSeries||[]).map(function(n){
      return {
        id:n.id, title:n.title, description:n.description||'', order:n.order, published:n.published !== false,
        items:(n.items||[]).map(function(x){ return { videoId:x.videoId, episode:x.episode, order:x.order }; })
      };
    })
  };
}
function saveCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(cachePayload())); }catch(e){}
}
function loadCache(){
  try{
    var raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return false;
    var parsed = JSON.parse(raw);
    if(!parsed || !parsed.settings || !Array.isArray(parsed.videos)) return false;
    DATA = {
      categories: parsed.categories || [],
      series: parsed.series || [],
      nestedSeries: parsed.nestedSeries || [],
      videos: parsed.videos || [],
      settings: normalizeSettings(parsed.settings),
      generated: parsed.generated || null,
      version: numberOr(parsed.version, 0)
    };
    lastVersion = numberOr(parsed.version, 0);
    buildModel();
    applySiteSettings();
    dataReady = true;
    return { cachedAt: numberOr(parsed.cachedAt, 0), version: lastVersion };
  }catch(e){ return false; }
}

/* ---------- Firestore public reads ---------- */
function publishedCollection(name){
  return cloud.fs.collection(name).where('published','==',true).get().then(function(snap){
    return snap.docs.map(function(doc){ return Object.assign({ id: doc.id }, doc.data()); });
  });
}
function fetchSnapshot(){
  return Promise.all([
    publishedCollection('categories'),
    publishedCollection('series'),
    publishedCollection('videos'),
    publishedCollection('nestedSeries'),
    cloud.fs.doc('settings/site').get().catch(function(){ return null; }),
    cloud.fs.doc('meta/publicVersion').get().catch(function(){ return null; })
  ]).then(function(results){
    var versionSnap = results[5];
    var versionData = versionSnap && versionSnap.exists ? (versionSnap.data() || {}) : {};
    return {
      categories: results[0],
      series: results[1],
      videos: results[2],
      nestedSeries: results[3],
      settings: results[4] && results[4].exists ? results[4].data() : DEFAULT_SETTINGS,
      version: numberOr(versionData.version, 0),
      generated: versionData.updatedAt && typeof versionData.updatedAt.toDate === 'function'
        ? versionData.updatedAt.toDate().toISOString()
        : (versionData.updatedAt ? String(versionData.updatedAt) : null)
    };
  });
}
function applySnapshot(snapshot){
  DATA = {
    categories: snapshot.categories || [],
    series: snapshot.series || [],
    nestedSeries: snapshot.nestedSeries || [],
    videos: snapshot.videos || [],
    settings: normalizeSettings(snapshot.settings),
    generated: snapshot.generated || null,
    version: numberOr(snapshot.version, 0)
  };
  lastVersion = DATA.version;
  buildModel();
  applySiteSettings();
  dataReady = true;
  saveCache();
  if(!fromHash()) render(); else render();
}
function showMainMessage(icon, text, retry){
  main.innerHTML = '<div class="empty"><div class="big">'+icon+'</div>'+esc(text)+
    (retry ? '<div style="margin-top:16px"><button class="cloud-btn" id="retryData" style="padding:8px 20px">إعادة المحاولة</button></div>' : '')+'</div>';
  var btn = document.getElementById('retryData');
  if(btn) btn.addEventListener('click', function(){ refreshPublicData(true); });
}
function refreshPublicData(force){
  if(!cloud.on || !cloud.fs || refreshInFlight) return Promise.resolve(false);
  refreshInFlight = true;
  if(!dataReady) showMainMessage('⏳', 'جارٍ تحميل الفهرس من Firestore…', false);
  return fetchSnapshot().then(function(snapshot){
    applySnapshot(snapshot);
    refreshInFlight = false;
    return true;
  }).catch(function(err){
    refreshInFlight = false;
    console.warn('public data load failed:', err);
    if(dataReady){
      var el = document.getElementById('syncLabel');
      if(el) el.textContent = '⚠️ تعذّر تحديث الفهرس — تُعرض نسخة محفوظة';
      return false;
    }
    var message = err && err.code === 'permission-denied'
      ? 'تعذّر تحميل الفهرس المنشور. تحقق من نشر قواعد Firestore.'
      : 'تعذّر تحميل الفهرس. تحقق من اتصالك بالإنترنت ثم أعد المحاولة.';
    showMainMessage('⚠️', message, true);
    return false;
  });
}
function watchVersion(){
  if(!cloud.on || !cloud.fs || versionUnsub) return;
  versionUnsub = cloud.fs.doc('meta/publicVersion').onSnapshot(function(snap){
    if(!snap.exists) return;
    var v = numberOr((snap.data()||{}).version, 0);
    if(!v) return;
    var cache = null;
    try{ cache = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); }catch(e){}
    var stale = !cache || (Date.now() - numberOr(cache.cachedAt, 0) > CACHE_MAX_AGE);
    if(v !== lastVersion || stale){ refreshPublicData(true); }
  }, function(){});
}

/* ---------- Firebase / auth / progress ---------- */
var cloud = { on:false, uid:null, name:null, ref:null, unsub:null, writeAt:0, syncAt:null };
function cloudWired(){
  return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined' && firebase.auth && firebase.firestore);
}
function initCloud(){
  if(!cloudWired()) return false;
  try{
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    cloud.fs = firebase.firestore();
    cloud.auth = firebase.auth();
    cloud.on = true;
    if(cloud.auth.getRedirectResult){
      cloud.auth.getRedirectResult().catch(function(e){
        if(e && e.code) console.warn('google redirect:', e.code);
      });
    }
    cloud.auth.onAuthStateChanged(function(u){
      if(u){
        cloud.uid = u.uid;
        cloud.name = u.displayName || u.email || 'مستخدم';
        cloudUser(u);
      } else {
        cloud.uid = null; cloud.name = null;
        if(cloud.unsub){ cloud.unsub(); cloud.unsub = null; }
        renderSidebar();
      }
    });
    return true;
  }catch(e){
    console.warn('Firebase init failed:', e);
    return false;
  }
}

function cloudUser(u){
  cloud.uid = u.uid;
  cloud.name = u.displayName || u.email || 'مستخدم';
  cloud.ref = cloud.fs.collection('progress').doc(cloud.uid);
  cloudLoadAndWatch();
}
function cloudLoadAndWatch(){
  var progressRef = cloud.ref;
  var legacyRef = cloud.fs.collection('users').doc(cloud.uid);
  progressRef.get().then(function(doc){
    if(doc && doc.exists) return { data: doc.data() || {}, legacy: false };
    return legacyRef.get().then(function(legacy){
      return { data: legacy && legacy.exists ? (legacy.data() || {}) : {}, legacy: true };
    }).catch(function(){ return { data:{}, legacy:true }; });
  }).then(function(result){
    var data = result.data || {};
    ((data && data.watched) || []).forEach(function(id){
      if(typeof id === 'string') watched.add(id);
    });
    if(data && data.last && data.last.id){
      lastWatched = { id:data.last.id, title:data.last.title || '' };
      try{ localStorage.setItem('makany-last', JSON.stringify(lastWatched)); }catch(e){}
    }
    saveWatched();
    cloud.writeAt = Date.now();
    // Move legacy progress into the dedicated progress collection without
    // deleting the old users/{uid} document.
    progressRef.set({ watched: Array.from(watched), last: lastWatched || {}, updated: Date.now() }, { merge:true }).catch(function(){});
    render();
    if(!cloud.unsub){
      cloud.unsub = progressRef.onSnapshot(function(snap){
        if(!snap.exists) return;
        var d = snap.data() || {};
        var changed = false;
        ((d.watched) || []).forEach(function(id){
          if(typeof id === 'string' && !watched.has(id)){ watched.add(id); changed = true; }
        });
        if(d.last && d.last.id && (Date.now() - cloud.writeAt) > 3000){
          if(!lastWatched || lastWatched.id !== d.last.id){
            lastWatched = { id:d.last.id, title:d.last.title || '' };
            try{ localStorage.setItem('makany-last', JSON.stringify(lastWatched)); }catch(e){}
            changed = true;
          }
        }
        cloud.syncAt = new Date();
        if(changed){ saveWatched(); render(); }
        else{ renderSidebar(); updateSyncLabel(); }
      }, function(){});
    }
  }).catch(function(err){
    console.warn('cloud load failed:', err);
  });
}
function cloudWatchWrite(id, add){
  if(!cloud.on || !cloud.ref || !cloud.uid) return;
  var fv = firebase.firestore.FieldValue;
  var p = { updated: Date.now() };
  p.watched = add ? fv.arrayUnion(id) : fv.arrayRemove(id);
  cloud.writeAt = Date.now();
  try{ cloud.ref.set(p, { merge:true }).catch(function(){}); }catch(e){}
}
function cloudWriteFull(){
  if(!cloud.on || !cloud.ref || !cloud.uid) return;
  cloud.writeAt = Date.now();
  try{ cloud.ref.set({ watched: Array.from(watched), updated: Date.now() }, { merge:true }).catch(function(){}); }catch(e){}
}
function cloudWriteLast(){
  if(!cloud.on || !cloud.ref || !cloud.uid) return;
  cloud.writeAt = Date.now();
  try{ cloud.ref.set({ last: lastWatched || {}, updated: Date.now() }, { merge:true }).catch(function(){}); }catch(e){}
}

  var el = document.getElementById('topbanner');
  if(!el) return;
  var b = normalizeSettings(DATA.settings).banner;
  var dismissed = '';
  try{ dismissed = sessionStorage.getItem('mk-banner-off') || ''; }catch(e){}
  if(b.enabled && b.text && dismissed !== b.text){
    el.classList.add('show');
    document.getElementById('btxt').textContent = b.text;

    el.classList.remove('show');
  }
}

function exportProgress(){
  var blob = new Blob([JSON.stringify({ ids: Array.from(watched), exported: new Date().toISOString() }, null, 1)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'makany-progress.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function importProgress(ev){
  var f = ev.target.files && ev.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var j = JSON.parse(r.result);
      var ids = j.ids || j;
      var n = 0;
      ids.forEach(function(id){ if(typeof id==='string'){ watched.add(id); n++; } });
      saveWatched(); cloudWriteFull();
      alert('تم استيراد '+n+' علامة مشاهدة ✅');
      render();
    }catch(e){ alert('ملف غير صالح'); }
  };
  r.readAsText(f);
  ev.target.value = '';
}

/* ---------- renderers ---------- */
function matchesKind(it){
  if(state.hideWatched && watched.has(it.id)) return false;
  if(state.kind==='all') return true;
  if(state.kind==='live') return kindOf(it)==='بثّ';
  return kindOf(it)!=='بثّ';
}
function sortItems(arr){
  arr = arr.filter(matchesKind);
  var s = state.sort;
  if(s==='views'){
    arr = arr.slice().sort(function(a,b){ return parseViews(b.views)-parseViews(a.views); });
  } else if(s==='newest'){
    arr = arr.slice().sort(function(a,b){ return parseAge(a.age)-parseAge(b.age); });
  } else if(s==='oldest'){
    arr = arr.slice().sort(function(a,b){ return parseAge(b.age)-parseAge(a.age); });
  }
  return arr;
}

    h.push('<button class="cat-card" data-cat="'+i+'">'+
      '<div class="top"><span class="ico" style="background:var(--accent-soft)">'+c.icon+'</span>'+
      '<h3>'+esc(c.name)+'</h3><span class="cnt">'+c.total+'</span></div>'+
      '<div class="desc">'+esc(c.desc||'')+'</div>'+
      '<div class="series-tags">'+c.series.slice(0,3).map(function(s){
        return '<span class="tag">'+esc(s.name.length>30? s.name.slice(0,30)+'…' : s.name)+'</span>';
      }).join('')+(c.series.length>3?'<span class="tag">+'+(c.series.length-3)+'</span>':'')+'</div>'+
    '</button>');
  });
  h.push('</div>');

  var all = allItems().map(function(it){ return Object.assign({}, it, { _ctx: CONTEXT_BY_ID.get(it.id) || { catShort:'', series:'' } }); });
  var top = all.sort(function(a,b){ return parseViews(b.views)-parseViews(a.views); }).slice(0,12);
  h.push('<div class="sec-title">🔥 الأكثر مشاهدة <span class="cnt">أعلى 12</span></div>');
  h.push('<section class="series open" style="margin-top:0"><div class="series-b" style="border-top:0">'+top.map(function(it){ return vrowHTML(it,'',true); }).join('')+'</section>');

  h.push('<footer>البيانات محدثة '+(DATA.generated ? 'بتاريخ '+esc(isoDay(DATA.generated)) : 'من لوحة التحكم')+' · قناة <a href="https://www.youtube.com/@MakanyWorld" target="_blank" rel="noopener" style="color:var(--accent); font-weight:700">@MakanyWorld</a> · تقدّمك محفوظ محليًا، ومع تسجيل الدخول يُزامن على حسابك.</footer>');
  main.innerHTML = h.join('');
  var cont = document.getElementById('contBtn');
  if(cont) cont.addEventListener('click', function(){
    var id = cont.getAttribute('data-id');
    var item = findItem(id);
    if(item){
      var ctx = CONTEXT_BY_ID.get(id);
      var catIndex = -1;
      CATS.forEach(function(c, i){ if(ctx && c.name === ctx.catShort) catIndex = i; });
      if(catIndex >= 0){ go({ view:'cat', cat:catIndex, focusSeries:ctx.series, pendingOpen:id }); return; }
    }
    alert('هذا الفيديو لم يعد منشورًا في الفهرس.');
  });
}

function renderCat(){
  var c = CATS[state.cat];
  if(!c){ go({view:'home'}); return; }
  var items = c.series.reduce(function(t,s){ return t + sortItems(s.items).length; }, 0);
  var h = [];
  h.push('<div class="crumb"><button data-nav="home">🏠 الرئيسية</button><span>›</span><span>'+esc(c.name)+'</span></div>');
  h.push('<div class="sec-title" style="margin-top:0"><span>'+c.icon+'</span>'+esc(c.name)+'<span class="cnt">'+items+' فيديو</span></div>');
  if(c.desc) h.push('<div class="note">'+esc(c.desc)+'</div>');
  h.push(toolbarHTML('عرض '+items+' من '+c.total));
  var ordered = c.series.slice().sort(function(a,b){
    var aN = a.items.filter(function(x){return x.ep!=null;}).length, bN = b.items.filter(function(x){return x.ep!=null;}).length;
    if(aN && !bN) return -1; if(!aN && bN) return 1; return b.items.length - a.items.length;
  });
  ordered.forEach(function(s, i){
    var open = (state.focusSeries!=null) ? (s.name===state.focusSeries) : (i===0);
    h.push(seriesSection(s, i, open, ''));
  });
  h.push('<div style="display:flex; gap:8px; margin-top:6px">'+
    '<button class="chip" id="expandAll">توسيع الكل</button><button class="chip" id="collapseAll">تقليص الكل</button></div>');
  main.innerHTML = h.join('');
  if(state.pendingOpen){
    var row = main.querySelector('.vrow[data-id="'+state.pendingOpen.replace(/"/g,'')+'"]');
    if(row){
      var sec = row.closest('.series');
      if(sec && !sec.classList.contains('open')) sec.classList.add('open');
      openPlayer(row, true);
    }
    state.pendingOpen = null;
  } else if(state.focusSeries){
    var el = main.querySelector('.series.open');
    if(el) setTimeout(function(){ el.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
  }
  state.focusSeries = null;
}

function renderNested(){
  var n = NESTED[state.nested];
  if(!n){ go({view:'nested-all'}); return; }
  var h = [];
  h.push('<div class="crumb"><button data-nav="nested-all">🧩 كل المواد</button><span>›</span><span>'+esc(n.name)+'</span></div>');
  h.push('<div class="note">هذه الحلقات مرقّمة داخل <b>مجالس فقه النفس</b> — مثال: «ونفس 95» داخل المجلس 123. اضغط أي حلقة لفتح المجلس الذي يحتويها.</div>');
  h.push('<div class="sec-title" style="margin-top:0"><span>🧩</span>'+esc(n.name)+'<span class="cnt">'+n.items.length+' حلقة</span></div>');
  h.push(toolbarHTML(''));
  h.push('<section class="series open" style="margin-top:0"><div class="series-b" style="border-top:0">');
  sortItems(n.items).forEach(function(it){ h.push(vrowHTML(it,'',false)); });
  h.push('</div></section>');
  main.innerHTML = h.join('');
}
function renderNestedAll(){
  var h = [];
  h.push('<div class="crumb"><button data-nav="home">🏠 الرئيسية</button><span>›</span><span>المواد المتداخلة</span></div>');
  h.push('<div class="sec-title" style="margin-top:0"><span>🧩</span>المواد المتداخلة داخل المجالس<span class="cnt">'+NESTED.length+'</span></div>');
  h.push('<div class="note">كل مجلس من مجالس فقه النفس يحتوي رقمًا لمادة أو أكثر (اقرأ، ونفس، لتعارفوا، فقه الأخلاق، الصبر، المخادعات…). اختر مادة لعرض حلقاتها كاملة بالترتيب.</div>');
  h.push('<div class="cat-grid">');
  NESTED.forEach(function(n, i){
    h.push('<button class="cat-card" data-nested="'+i+'">'+
      '<div class="top"><span class="ico" style="background:var(--accent-soft)">🧩</span>'+
      '<h3>'+esc(n.name)+'</h3><span class="cnt">'+n.items.length+'</span></div>'+
      '<div class="desc">حلقات مادة «'+esc(n.name)+'» داخل مجالس فقه النفس</div></button>');
  });
  h.push('</div>');
  main.innerHTML = h.join('');
}
function renderSearch(){
  var q = state.q.trim();
  var results = allItems().filter(function(it){
    return (it.title||it.t||'').indexOf(q) !== -1 && matchesKind(it);
  }).map(function(it){ return Object.assign({}, it, { _ctx: CONTEXT_BY_ID.get(it.id) || { catShort:'', series:'' } }); });
  results.sort(function(a,b){ return parseViews(b.views)-parseViews(a.views); });

  var h = [];
  h.push('<div class="crumb"><span>🔍 نتائج البحث</span></div>');
  h.push('<div class="sec-title" style="margin-top:0"><span>🔍</span>'+esc(q)+'<span class="cnt">'+results.length+' نتيجة</span></div>');
  h.push(toolbarHTML('مرتّبة بالأكثر مشاهدة'));
  if(!results.length){
    h.push('<div class="empty"><div class="big">🤷‍♂️</div>لا توجد نتائج مطابقة — جرّب كلمة أقصر أو رقم حلقة.</div>');
  } else {
    h.push('<section class="series open" style="margin-top:0"><div class="series-b" style="border-top:0">');
    results.forEach(function(it){ h.push(vrowHTML(it, q, true)); });
    h.push('</div></section>');
  }
  main.innerHTML = h.join('');
}

function render(){
  if(!dataReady){
    showMainMessage('⏳', 'جارٍ تحميل الفهرس من Firestore…', false);
    return;
  }
  renderSidebar();
  if(state.view==='search') renderSearch();
  else if(state.view==='cat') renderCat();
  else if(state.view==='nested') renderNested();
  else if(state.view==='nested-all') renderNestedAll();
  else renderHome();
  if(!state.keepScroll) window.scrollTo({top:0});
  state.keepScroll = false;
  updateHash();
}

/* ---------- inline player ---------- */
function openPlayer(row, scrollOnly){
  var id = row.dataset.id;
  var existing = main.querySelector('.player');
  if(existing && existing.dataset.for === id){ existing.remove(); return; }
  if(existing) existing.remove();
  var d = document.createElement('div');
  d.className = 'player'; d.dataset.for = id;
  var isFile = location.protocol === 'file:';
  d.innerHTML = '<div class="frame"><iframe src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&playsinline=1" title="مشغّل يوتيوب" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>'+
    '<div class="pbar"><span>المشغّل مش بيفتح؟ <a href="https://www.youtube.com/watch?v='+encodeURIComponent(id)+'" target="_blank" rel="noopener">شاهده على يوتيوب ↗</a></span>'+
    (isFile ? '<span class="pnote">⚠ فاتح الموقع كملف محلي — المشغّل يحتاج خادم: شغّل الموقع عبر Firebase Hosting أو خادم محلي.</span>' : '')+
    '</div>';
  row.after(d);
  var title = row.querySelector('.title') ? row.querySelector('.title').textContent : '';
  saveLast(id, title);
  d.scrollIntoView({behavior:'smooth', block:'center'});
  cloudWriteLast();
}
function toggleWatched(id, cb){
  if(watched.has(id)) watched.delete(id); else watched.add(id);
  saveWatched();
  cloudWatchWrite(id, watched.has(id));
  cb.classList.toggle('on', watched.has(id));
  cb.textContent = watched.has(id) ? '✓' : '';
  var row = cb.closest('.vrow');
  if(row) row.classList.toggle('watched', watched.has(id));
  updateProgressUI();
}
function updateProgressUI(){
  var wCount = 0;
  allItems().forEach(function(it){ if(watched.has(it.id)) wCount++; });
  var pct = TOTAL ? Math.round(wCount * 100 / TOTAL) : 0;
  var rw = sidebar.querySelector('.side-progress .row1 span');
  var rb = sidebar.querySelector('.side-progress .bar i');
  if(rw) rw.textContent = wCount+' / '+TOTAL+' ('+pct+'%)';
  if(rb) rb.style.width = pct+'%';
  var sec = main.querySelectorAll('.series[data-series-name]');
  sec.forEach(function(el){
    var name = el.dataset.seriesName;
    var c = CATS[state.cat];
    if(!c) return;
    var s = c.series.find(function(x){ return x.name === name; });
    if(!s) return;
    var w = s.items.filter(function(x){ return watched.has(x.id); }).length;
    var badge = el.querySelector('.prog');
    if(w > 0){
      if(!badge){ badge = document.createElement('span'); badge.className='prog'; el.querySelector('.series-h').insertBefore(badge, el.querySelector('.chev')); }
      badge.textContent = '✓ '+w+'/'+s.items.length;
    } else if(badge){ badge.remove(); }
  });
}

/* ---------- events ---------- */
main.addEventListener('click', function(ev){
  var cat = ev.target.closest('[data-cat]');
  if(cat){ go({view:'cat', cat:+cat.getAttribute('data-cat'), q:''}); return; }
  var nested = ev.target.closest('[data-nested]');
  if(nested){ go({view:'nested', nested:+nested.getAttribute('data-nested')}); return; }
  var nav = ev.target.closest('[data-nav]');
  if(nav){
    var v = nav.getAttribute('data-nav');
    if(v==='home') go({view:'home'});
    else if(v==='nested-all') go({view:'nested-all'});
    return;
  }
  var wb = ev.target.closest('.watch-cb');
  if(wb){ toggleWatched(wb.closest('.vrow').dataset.id, wb); return; }
  var kind = ev.target.closest('[data-kind]');
  if(kind){ state.kind = kind.getAttribute('data-kind'); render(); return; }
  if(ev.target.id==='hideW'){ state.hideWatched = !state.hideWatched; render(); return; }
  if(ev.target.id==='expandAll'){ main.querySelectorAll('.series').forEach(function(s){ s.classList.add('open'); }); return; }
  if(ev.target.id==='collapseAll'){ main.querySelectorAll('.series').forEach(function(s){ s.classList.remove('open'); }); return; }
  var sh = ev.target.closest('.series-h');
  if(sh){ sh.closest('.series').classList.toggle('open'); return; }
  if(ev.target.closest('.yt-link')) return;
  var row = ev.target.closest('.vrow');
  if(row){ openPlayer(row); }
});
main.addEventListener('change', function(ev){
  if(ev.target.id==='sortSel'){ state.sort = ev.target.value; render(); }
});
sidebar.addEventListener('click', function(ev){
  var cat = ev.target.closest('[data-cat]');
  if(cat){ closeDrawer(); go({view:'cat', cat:+cat.getAttribute('data-cat'), q:''}); return; }
  var nested = ev.target.closest('[data-nested]');
  if(nested){ closeDrawer(); go({view:'nested', nested:+nested.getAttribute('data-nested')}); return; }
  var nav = ev.target.closest('[data-nav]');
  if(nav){ closeDrawer(); go({view:'home'}); }
});

/* search */
var t0 = null;
$('#q').addEventListener('input', function(ev){
  var v = ev.target.value;
  $('#clearq').hidden = !v;
  clearTimeout(t0);
  t0 = setTimeout(function(){
    state.q = v;
    if(v.trim().length>=2){ state.view='search'; render(); }
    else if(state.view==='search'){ go({view:'home'}); }
  }, 130);
});
$('#clearq').addEventListener('click', function(){ $('#q').value=''; $('#clearq').hidden=true; state.q=''; if(state.view==='search') go({view:'home'}); });

/* theme */
var themeBtn = $('#theme');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = (t==='dark') ? '☀️' : '🌙';
  try{ localStorage.setItem('makany-theme', t); }catch(e){}
}
themeBtn.addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur==='dark' ? 'light' : 'dark');
});
try{ var saved = localStorage.getItem('makany-theme'); if(saved) applyTheme(saved); }catch(e){}

/* drawer */
function openDrawer(){ $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); }
function closeDrawer(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }
$('#menuBtn').addEventListener('click', openDrawer);
$('#overlay').addEventListener('click', closeDrawer);

/* back to top */
var totop = $('#totop');
window.addEventListener('scroll', function(){ totop.classList.toggle('show', window.scrollY > 700); });
totop.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });

/* ---------- auth modal ---------- */
var authModal = $('#authModal');
function openAuth(){
  var err = document.getElementById('authErr');
  if(err) err.textContent = '';
  authModal.classList.add('show');
  var em = document.getElementById('authEmail');
  if(em) em.focus();
}
function closeAuth(){ authModal.classList.remove('show'); }
document.getElementById('btnGoogle').addEventListener('click', function(){
  var err = document.getElementById('authErr');
  try{
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt:'select_account' });
    err.textContent = '⏳ فتح نافذة جوجل… اضغط الزر مرة واحدة فقط وانتظرها تفتح';
    cloud.auth.signInWithPopup(provider).then(function(){ closeAuth(); })
      .catch(function(e){
        var soft = ['auth/popup-blocked','auth/popup-closed-by-user','auth/cancelled-popup-request','auth/operation-not-supported-in-this-environment'];
        if(soft.indexOf(e && e.code) !== -1){
          err.textContent = '⏳ جارٍ تحويلك لصفحة جوجل كاملة… لا تغلق هذه النافذة';
          try{ cloud.auth.signInWithRedirect(provider).catch(function(e2){ err.textContent = arabicAuthErr(e2); }); }
          catch(e2){ err.textContent = arabicAuthErr(e2); }
        } else { err.textContent = arabicAuthErr(e); }
      });
  }catch(e){ err.textContent = 'الميزة غير متاحة — استخدم الدخول بالبريد الإلكتروني'; }
});
function emailAuth(signUp){
  var err = document.getElementById('authErr');
  var em = document.getElementById('authEmail').value.trim();
  var pw = document.getElementById('authPass').value;
  if(!em || !pw){ err.textContent = 'أدخل البريد وكلمة المرور'; return; }
  if(signUp && pw.length < 6){ err.textContent = 'كلمة المرور قصيرة — 6 أحرف على الأقل'; return; }
  err.textContent = '…';
  var op = signUp ? cloud.auth.createUserWithEmailAndPassword(em, pw) : cloud.auth.signInWithEmailAndPassword(em, pw);
  op.then(function(){ closeAuth(); })
    .catch(function(e){
      if(!signUp && (e && (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential'))){
        err.textContent = (e.code === 'auth/invalid-credential')
          ? 'لا يوجد حساب بهذا البريد بهذه الكلمة — إن كانت أول مرة: اضغط «إنشاء حساب جديد» لتضع كلمة مرور'
          : arabicAuthErr(e);
      } else { err.textContent = arabicAuthErr(e); }
    });
}
document.getElementById('btnEmailIn').addEventListener('click', function(){ emailAuth(false); });
document.getElementById('btnEmailUp').addEventListener('click', function(){ emailAuth(true); });
document.getElementById('btnForgot').addEventListener('click', function(){
  var err = document.getElementById('authErr');
  var em = document.getElementById('authEmail').value.trim();
  if(!em){ err.textContent = 'اكتب بريدك في خانة البريد أعلاه أولًا، ثم اضغط هذا الزر'; return; }
  err.textContent = '⏳ جارٍ الإرسال…';
  try{
    cloud.auth.sendPasswordResetEmail(em)
      .then(function(){ err.textContent = '✅ أرسلنا رابط استعادة كلمة المرور إلى بريدك — افتح الرسالة واتبع الرابط (افحص مجلد سبام إن لم تجدها)'; })
      .catch(function(e){ err.textContent = arabicAuthErr(e); });
  }catch(e){ err.textContent = 'الميزة غير متاحة هنا'; }
});
document.getElementById('authPass').addEventListener('keydown', function(ev){ if(ev.key==='Enter') emailAuth(false); });
document.getElementById('authEmail').addEventListener('keydown', function(ev){ if(ev.key==='Enter') document.getElementById('authPass').focus(); });
document.getElementById('authClose').addEventListener('click', closeAuth);
authModal.addEventListener('click', function(ev){ if(ev.target===authModal) closeAuth(); });

/* keyboard */
document.addEventListener('keydown', function(ev){
  if((ev.ctrlKey||ev.metaKey) && ev.key==='k'){ ev.preventDefault(); $('#q').focus(); }
  if(ev.key==='Escape'){ closeDrawer(); closeAuth(); var p = main.querySelector('.player'); if(p) p.remove(); }
});
document.getElementById('bclose').addEventListener('click', function(){
  try{ sessionStorage.setItem('mk-banner-off', document.getElementById('btxt').textContent || ''); }catch(e){}
  applyBanner();
});

/* hash routing */
function updateHash(){
  var h = '';
  if(state.view==='cat') h = 'cat-'+state.cat;
  else if(state.view==='nested') h = 'nested-'+state.nested;
  else if(state.view==='nested-all') h = 'nested';
  if(('#'+h) !== location.hash){
    try{ history.replaceState(null,'', h?('#'+h):location.pathname); }catch(e){}
  }
}
function fromHash(){
  var m = location.hash.match(/^#cat-(\d+)$/);
  if(m && CATS[+m[1]]){ state.view='cat'; state.cat=+m[1]; return true; }
  m = location.hash.match(/^#nested-(\d+)$/);
  if(m && NESTED[+m[1]]){ state.view='nested'; state.nested=+m[1]; return true; }
  if(location.hash==='#nested'){ state.view='nested-all'; return true; }
  return false;
}
function go(next){ Object.assign(state, next); render(); }

/* ---------- boot ---------- */
var cached = loadCache();
if(cached) render();
initCloud();
if(!cloud.on){
  showMainMessage('⚠️', 'تعذّر تهيئة Firebase. تحقق من firebase_config.json واتصال الشبكة.', true);
} else {
  refreshPublicData(!cached);
  watchVersion();
}
})();
</script>
